# This is the file containing default values for all options you can specify for the plotting
# script at runtime via YAML input.
# Details about the specific sections (groups of variables for a particular purpose) and
# individual variables can be found in the comments above each specific section/variable below.
#
# Some sections also include subsections with further settings related to a particular part of
# the plotting script; these are differentiated by the indentation level.
#
# Some variables must be specified in the plot_options.yaml file (the default values are invalid);
# these variables are labeled "(mandatory)".

# This section is for variables related to the specific data you want to plot
dataset:
  #
  # files (mandatory):
  # Full or relative path to filename containing MPAS data you wish to plot. Can be a single file,
  # a glob-able regex pattern match (e.g. /path/to/nc/data/*.nc), or a list of files
  #
  # gridfile:
  # Some MPAS files (usually "diag" files) do not contain grid information; in these cases you
  # must specify a "gridfile" that contains the grid information for the script to read. This can
  # be a static.nc file, init.nc file, or even a history file from the MPAS forecast
  # NOTE: Since only one gridfile can be specified, it is not possible to mix-and-match gridded
  #       and gridless files
  #
  files: ''
  gridfile: ''

  # vars:
  # Dictionary of variables to plot. The key(s) of this dictionary should be the name of the
  # variables to plot, and the value for each key should be a dictionary of settings; for each
  # variable, source: is the only required variable. See config_plot.yaml.example for examples
  # of how this section can be filled in.

  # Note that for 'lev' you must provide a list of values, even if there is just one item in that
  # list. If no 'lev' is provided, all levels will be plotted. Some specific examples of how to
  # specify various combinations of variable and levels are provided below:

  # To plot the variable theta at the 9th vertical level, use the following settings:
  #   vars:
  #     theta:
  #       source: native
  #       lev:
  #         - 9
  #
  # To plot the variables qv and rho at all levels, use the following settings:
  #   vars:
  #     qv:
  #       source: native
  #     rho:
  #       source: native
  #
  # To plot the variable theta at levels 1-6, and vorticity at all levels, use the following settings:
  #   vars:
  #     theta:
  #       source: native
  #       lev:
  #         - 1
  #         - 2
  #         - 3
  #         - 4
  #         - 5
  #         - 6
  #     rho:
  #       source: native

  # By default a variable is plotted as a horizontal map of each requested model level. To
  # produce more than one kind of figure from the same variable, give it one block per plot
  # type. The available plot types are:
  #    model_level    A horizontal map of a single vertical level (what you get by default)
  #    cross_section  A vertical cross-section along one or more named transects
  #
  # Anything written directly under the variable applies to every one of its blocks, so the
  # settings a map and a section have in common need only be given once:
  #
  #   vars:
  #     uReconstructZonal:
  #       source: native
  #       vertcoord: nVertLevels    # applies to both blocks below
  #       plot:                     # so does this
  #         colormap: RdBu_r
  #       model_level:
  #         lev:
  #           - 0
  #           - 30
  #         plot:                   # overrides the plot: settings above
  #           vmin: 0
  #           vmax: 60
  #       cross_section:
  #         ymax: 12000             # a cross_section: setting (see the section at the end
  #         plot:                   # of this file), overriding it for this variable only
  #           vmin: -20
  #           vmax: 20
  #
  # Inside a block, 'lev' and 'vertcoord' override the value given for the variable as a
  # whole, 'plot' overrides its plot settings, and every other key is a setting of that plot
  # type. A variable with no block at all is plotted as a model_level map, exactly as before.

  vars:

# This section is for variables related to how the plot(s) is/are created. Note that any settings
# here can be overridden on a per-variable basis above, by including a plot: section under any
# specific variable
plot:
  # filename:
  # The filename of the output plot(s). If an extension is included (e.g. ".png"), it will determine the format of the image.
  #
  # format:
  # The image format of the output, if not specified in the filename. See matplotlib documentation for valid options:
  # https://matplotlib.org/stable/api/_as_gen/matplotlib.pyplot.savefig.html#matplotlib.pyplot.savefig
  #
  # title:
  # Settings controlling the title of the output plot(s) that will appear in the image above the plotted data.
  #   text:
  #   The text of the title. To create a plot with no title, set "text" to a blank string.
  #   fontsize:
  #   The font size to use for the title.
  #
  # exists:
  # Handle case when file exists. Valid options are
  #    overwrite  Overwrite existing file
  #    abort      Raise an exception
  #    rename     Rename the old file using the scheme {filename}-#.png, where # is the next available sequential integer
  #
  # dpi:
  # Image dots per inch
  #
  # figheight:
  # Image height in inches
  #
  # figwidth:
  # Image width in inches

  # NOTE: for text fields such as filename, title, etc., some helpful variables are provided that
  # you can reference in the text string that will be substituted in the final output:
  # {var} = Variable name
  # {lev} = Variable level (for cross-section plots, the name of the transect)
  # {levlabel} = "level <n>", or "transect <name>" for cross-section plots
  # {ptype} = The kind of plot being produced (model_level, cross_section)
  # {varln} = Variable "long name" (not recommended for filenames since these often contain spaces)
  # {units} = Variable units
  # {filename} = Name of file being read for plotted data
  # {fnme} = Name of file (minus extension) being read for plotted data
  # {date} = The date of plotted data, in %Y-%m-%d format
  # {time} = The time of plotted data, in %H:%M:%S format
  # {maxval} = The maximum value in the plotted data
  # {minval} = The minimum value in the plotted data

  filename: '{var}_{lev}.png'
  format: null
  title:
    text: 'Plot of {varln}, {levlabel} for MPAS forecast, {date} {time}'
    fontsize: 8
  exists: rename
  dpi: 200
  figheight: 3
  figwidth: 6

  # colormap:
  # Color scheme to use for output plots. Options can either be standard Matplotlib colormaps (reference
  # https://matplotlib.org/stable/gallery/color/colormap_reference.html for valid options) or the name of
  # a custom colormap under the colormaps/ directory (currently just one option: "radar_refl").
  #
  # NOTE: custom colormaps also include additional settings that will overwrite user config choices; see
  # README.md for more information.
  #
  colormap: "viridis"

  # pixel_ratio:
  # This controls the quantity of pixels to sample in the rasterization process; higher numbers result
  # in higher quality plots, though at a cost of plotting speed.
  pixel_ratio: 1

  # polycollection:
  # NOT RECOMMENDED
  # This is the legacy plotting method that converts the unstructured grid to a set of polygons.
  # This can be orders of magnitude slower than the default raster method and so is not
  # recommended for large domains; if you need more detail in your plot, it's recommended to
  # increase the "pixel_ratio" setting.
  # periodic_bdy:
  # For periodic domains (including global), the polycollection routines will omit the boundary cells by default. To plot
  # all data, including boundaries, set this option to True, but note that it will slow down plotting substantially.
  #
  polycollection: False
  periodic_bdy: True # Set to false once UXarray issue is fixed! https://github.com/UXARRAY/uxarray/issues/1507

  # vmin, vmax:
  # By default the color range will be scaled to the max/min values of the plotted data. To use a custom range,
  # set vmin and/or vmax

  vmin: null
  vmax: null

  # plot_under, plot_over:
  # By default any values above vmax or below vmin will be plotted as the color for vmax/vmin respectively.
  # To omit these out-of-range values all together, set plot_over/plot_under to False respectively.

  plot_under: True
  plot_over: True

  # Settings for plotting grid cell borders. To disable cell borders, set color="face" (colors the border the same as cell face)
  # or set width=0
  edges:
    color: face
    width: 0.1

  # Settings for plotting political boundaries. Settings scale, color, linewidth can either be a single value (to apply to all boundaries)
  # or a list of values to apply to the specific level 0, 1, or 2 boundaries described below
  boundaries:
    enable: True
    # Level of political boundaries to plot. Level 0 is national boundaries, Level 1 is sub-national boundaries (e.g.
    # states, provinces, etc.), Level 2 is county boundaries (US only); counties require 10m scale
    detail: 0
    color: ['black','black','black']
    linewidth: [0.2,0.2,0.2]
    # Scale is the resolution of the plotted boundary dataset. Options are 110m, 50m, and 10m.
    scale: ['50m','50m','50m']

  # Settings for plotting coastlines.
  coastlines:
    enable: True
    # Scale is the resolution of the plotted boundary dataset. Options are 110m, 50m, and 10m.
    scale: '10m'
    color: 'black'
    linewidth: 0.5

  # Settings for plotting lakes.
  lakes:
    enable: False
    # Scale is the resolution of the plotted boundary dataset. Options are 110m, 50m, and 10m.
    scale: '50m'
    color: 'black'
    linewidth: 0.5

  # Settings for drawing the path of a cross-section transect on a map, so that a horizontal
  # plot can show where a vertical section through it was taken. The transects themselves are
  # defined in the top-level cross_section:transects section (or in a variable's own
  # cross_section: block); these settings only control which of them are drawn, and how.
  # Cross-section plots ignore this.
  transects:
    # names:
    # Which transects to draw, named the same way a variable picks the ones it is sectioned
    # along: a list of transect names, a single name, or "all" for every transect defined.
    # Unset, as it is here, means draw none, so a map carries no transect lines unless it
    # asks for them. For example:
    #
    #   dataset:
    #     vars:
    #       theta:
    #         source: native
    #         model_level:
    #           plot:
    #             transects:
    #               names: [cascades]
    #         cross_section:
    #           names: [cascades]
    #
    # Note that this is a separate setting from cross_section:names: this one picks the lines
    # a map draws, that one picks the transects a variable is sectioned along. They are
    # usually the same list, but nothing requires it -- a map can show every transect in the
    # domain while the variable is sectioned along only one of them.
    names: null
    color: 'magenta'
    linewidth: 1.0
    linestyle: '-'
    # Write the name of each transect at the point where it starts
    label: True
    fontsize: 6

  # Settings for the plot's color bar
  colorbar:
    # orientation:
    # The orientation of the color bar. Valid values are "horizontal" or "vertical"
    #
    # label:
    # Text to tabel colorbar; can use variables described at start of "plot:" section
    #
    # fontsize:
    # Font size for the colobar label.
    enable: True
    orientation: vertical
    label: 'Units: {units}'
    fontsize: 8
    datalabels: null

  # Settings for the output map projection:
  projection:
    # Name of the actual projection; for valid options see https://scitools.org.uk/cartopy/docs/latest/reference/projections.html
    # A few special projections are not yet supported: UTM, OSGB, LambertZoneII, EuroPP, OSNI
    projection: PlateCarree
    # Range of latitudes/longitudes to plot. Each should be a 2-element list, with the first entry being less than the second
    latrange:
      - null
      - null
    lonrange:
      - null
      - null
    # Central lat/lon; needed to center the projection for some projections. If not supported, values will be ignored
    central_lat: null
    central_lon: null
    # Satellite height (meters): used for Geostationary and NearsidePerspective projections that simulate a satellite view
    satellite_height: null
    # Standard parallels: used for setting projection parameters for AlbersEqualArea, EquidistantConic, and LambertConformal
    standard_parallels:
      - null
      - null

# ---------------------------------------------------------------------------------------
# Settings for cross-section plots, shared by every variable that asks for one.
#
# A variable produces cross-sections when it has a "cross_section:" block of its own under
# dataset:vars; any setting below can be repeated in that block to change it for just that
# variable. See the comments above dataset:vars for the full structure.
cross_section:
  # transects:
  # A dictionary of named transects to plot along. Each key is the name of a transect, and
  # each value is a list of [latitude, longitude] waypoints in degrees. Consecutive waypoints
  # are joined by great-circle arcs, so two waypoints give a straight section and additional
  # waypoints let the section bend to follow a feature. For example:
  #
  #   transects:
  #     cascades:
  #       - [45.0, -124.5]
  #       - [45.0, -119.0]
  #     dogleg:
  #       - [47.5, -124.0]
  #       - [46.0, -121.5]
  #       - [44.0, -121.0]
  #
  # One plot is produced per transect, per variable, per time. Note that the {lev}
  # substitution described above is the transect name for cross-section plots, so the
  # default filename and title settings still give each transect its own output file.
  transects: {}

  # names:
  # Which of the transects above a variable should be plotted along: either "all", or a list
  # of transect names. Transects are defined once, here, and each variable picks the ones it
  # wants rather than repeating the geometry:
  #
  #   cross_section:
  #     transects:
  #       boulder: [[40.0, -107.0], [40.0, -104.0]]
  #       dillon:  [[39.63, -107.0], [39.63, -104.0]]
  #
  #   dataset:
  #     vars:
  #       uReconstructZonal:
  #         source: native
  #         cross_section:          # every transect
  #       w:
  #         source: native
  #         cross_section:
  #           names: [boulder]      # just this one
  names: all

  # steps:
  # The number of points sampled along the transect. For a transect with several segments
  # these are shared out in proportion to the length of each segment. Higher values give a
  # more detailed plot, at some cost in plotting speed.
  steps: 200

  # vertical:
  # What to plot on the vertical axis. Valid options are:
  #    auto    Geometric height if the height variable (see "zvar") can be read, otherwise
  #            the model level index
  #    height  Geometric height in meters; an error if the height variable cannot be read
  #    level   Model vertical level index
  vertical: auto

  # zvar:
  # The name of the variable holding the geometric height of each layer interface
  # (dimensions nCells x nVertLevelsP1). It is read from the data files if present, and from
  # dataset:gridfile if not; in MPAS it is normally only in the init.nc or static.nc file.
  # Only used when "vertical" resolves to "height".
  zvar: zgrid

  # xaxis:
  # What to plot on the horizontal axis. Valid options are:
  #    distance  Distance along the transect, in km
  #    lat       Latitude of each sample point
  #    lon       Longitude of each sample point
  xaxis: distance

  # shading:
  # How the sampled data is shaded between points; this is passed through to Matplotlib's
  # pcolormesh. Valid options are:
  #    flat     Each value fills exactly one model cell by one model level, using the layer
  #             interfaces from "zvar" as the cell edges. This is the most literal picture
  #             of the data, and the default
  #    gouraud  Interpolates smoothly between sample points. This is the conventional look
  #             for a cross-section, but Matplotlib draws each quadrilateral as two shaded
  #             triangles, which shows up as a triangular texture wherever a cell is only a
  #             few pixels wide -- usually in the thick levels aloft
  #    nearest  Like flat, but with the cell edges inferred from the sample points instead
  #             of taken from the model; Matplotlib warns that terrain-following heights are
  #             not monotonic when it does this
  shading: flat

  # ymin, ymax:
  # The range of the vertical axis, in meters for "height" or in level index for "level".
  # Leave as null to fit the range of the data. Setting ymax is the usual way to crop a
  # section to the lower troposphere, where most of the interesting structure is.
  ymin: null
  ymax: null

  # Settings for shading in the terrain below the cross-section. Only drawn when the
  # vertical axis is geometric height, since model levels have no terrain to draw.
  terrain:
    enable: True
    color: 'darkgrey'
